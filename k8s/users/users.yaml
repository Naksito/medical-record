# Users Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: medical-record
  labels:
    app: users-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
      - name: users-service
        image: __USERS_IMAGE__:__USERS_TAG__
        imagePullPolicy: Always
        ports:
          - containerPort: 9090
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        env:
          - name: USERS_PORT
            value: "9090"
          - name: DB_URL
            value: "jdbc:postgresql://postgres:5432/users"
          - name: DB_USERNAME
            value: "admin"
          - name: DB_PASSWORD
            value: "admin"
        livenessProbe:
          grpc:
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          grpc:
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 10
      imagePullSecrets:
        - name: regcred

---

# Users Service
apiVersion: v1
kind: Service
metadata:
  name: users-service
  namespace: medical-record
spec:
  selector:
    app: users-service
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP