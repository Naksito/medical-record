name: CI/CD Pipeline

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'k8s/versions.yaml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      images_changed: ${{ steps.release.outputs.images_changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Extract per-service versions
        id: svc_versions
        run: |
          {
            echo "auth_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=auth.version)"
            echo "users_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=users.version)"
            echo "appointments_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=appointments.version)"
            echo "api_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=api.version)"
            echo "frontend_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=frontend.version)"
          } >> "$GITHUB_OUTPUT"

      - name: Select services to publish
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/select_release_services.py --all >> "$GITHUB_OUTPUT"
          else
            python scripts/select_release_services.py --base-ref "${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.release.outputs.images_changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push auth image
        if: steps.release.outputs.auth == 'true'
        env:
          SERVICE_VERSION: ${{ steps.svc_versions.outputs.auth_version }}
        run: |
          docker build \
            --build-arg "SERVICE_VERSION=$SERVICE_VERSION" \
            -t "naksito03/auth-service:$SERVICE_VERSION" \
            -t naksito03/auth-service:latest \
            ./auth
          docker push "naksito03/auth-service:$SERVICE_VERSION"
          docker push naksito03/auth-service:latest

      - name: Build and push api image
        if: steps.release.outputs.api == 'true'
        env:
          SERVICE_VERSION: ${{ steps.svc_versions.outputs.api_version }}
        run: |
          docker build \
            --build-arg "SERVICE_VERSION=$SERVICE_VERSION" \
            -t "naksito03/api-service:$SERVICE_VERSION" \
            -t naksito03/api-service:latest \
            ./api
          docker push "naksito03/api-service:$SERVICE_VERSION"
          docker push naksito03/api-service:latest

      - name: Build and push users image
        if: steps.release.outputs.users == 'true'
        env:
          SERVICE_VERSION: ${{ steps.svc_versions.outputs.users_version }}
        run: |
          docker build \
            --build-arg "SERVICE_VERSION=$SERVICE_VERSION" \
            -t "naksito03/users-service:$SERVICE_VERSION" \
            -t naksito03/users-service:latest \
            ./users
          docker push "naksito03/users-service:$SERVICE_VERSION"
          docker push naksito03/users-service:latest

      - name: Build and push appointments image
        if: steps.release.outputs.appointments == 'true'
        env:
          SERVICE_VERSION: ${{ steps.svc_versions.outputs.appointments_version }}
        run: |
          docker build \
            --build-arg "SERVICE_VERSION=$SERVICE_VERSION" \
            -t "naksito03/appointments-service:$SERVICE_VERSION" \
            -t naksito03/appointments-service:latest \
            ./appointments
          docker push "naksito03/appointments-service:$SERVICE_VERSION"
          docker push naksito03/appointments-service:latest

      - name: Build and push frontend image
        if: steps.release.outputs.frontend == 'true'
        env:
          SERVICE_VERSION: ${{ steps.svc_versions.outputs.frontend_version }}
        run: |
          docker build \
            --build-arg "SERVICE_VERSION=$SERVICE_VERSION" \
            -t "naksito03/frontend-service:$SERVICE_VERSION" \
            -t naksito03/frontend-service:latest \
            ./frontend
          docker push "naksito03/frontend-service:$SERVICE_VERSION"
          docker push naksito03/frontend-service:latest

  deploy:
    needs: build-and-push
    if: needs.build-and-push.outputs.images_changed == 'true'
    runs-on: ubuntu-latest
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
      TF_VAR_kubeconfig_path: ${{ github.workspace }}/.kube/config

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          printf '%s' "$KUBE_CONFIG" > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl config view >/dev/null
          kubectl config current-context >/dev/null

      - name: Import existing Kubernetes resources
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_users_db_password: ${{ secrets.USERS_DB_PASSWORD }}
          TF_VAR_appointments_db_password: ${{ secrets.APPOINTMENTS_DB_PASSWORD }}
        run: |
          terraform -chdir=terraform init -upgrade
          terraform -chdir=terraform import kubernetes_namespace_v1.medical_record medical-record || true
          terraform -chdir=terraform import kubernetes_secret_v1.auth_secret medical-record/auth-secret || true
          terraform -chdir=terraform import kubernetes_secret_v1.users_secret medical-record/users-secret || true
          terraform -chdir=terraform import kubernetes_secret_v1.appointments_secret medical-record/appointments-secret || true

      - name: Provision Kubernetes resources with Terraform
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_users_db_password: ${{ secrets.USERS_DB_PASSWORD }}
          TF_VAR_appointments_db_password: ${{ secrets.APPOINTMENTS_DB_PASSWORD }}
        run: |
          terraform -chdir=terraform apply -auto-approve

      - name: Render and deploy Kubernetes manifests
        run: |
          python scripts/render_manifests.py
          kubectl apply -f /tmp/medical-record-k8s-rendered/namespace.yaml
          kubectl apply -f /tmp/medical-record-k8s-rendered/postgresql/postgresql.yaml
          kubectl apply -f /tmp/medical-record-k8s-rendered/auth/auth.yaml
          kubectl apply -f /tmp/medical-record-k8s-rendered/users/users.yaml
          kubectl apply -f /tmp/medical-record-k8s-rendered/appointments/appointments.yaml
          kubectl apply -f /tmp/medical-record-k8s-rendered/api/api.yaml
          kubectl apply -f /tmp/medical-record-k8s-rendered/frontend/frontend.yaml

      - name: Verify Kubernetes rollout
        run: |
          for deployment in postgres auth-service users-service appointments-service api-service frontend-service; do
            echo "Waiting for deployment/$deployment to become available..."
            if ! kubectl rollout status "deployment/$deployment" -n medical-record --timeout=600s; then
              echo "$deployment rollout failed. Showing diagnostics..."
              kubectl get pods -n medical-record -o wide || true
              kubectl describe deployment "$deployment" -n medical-record || true
              kubectl describe pod -n medical-record -l "app=$deployment" || true
              kubectl logs -n medical-record -l "app=$deployment" --all-containers=true || true
              exit 1
            fi
          done
          echo "All deployments are available."
          kubectl get pods -n medical-record
