name: CI/CD Pipeline

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/versions.yaml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Extract per-service versions
        id: svc_versions
        run: |
          echo "auth_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=auth.version)" >> $GITHUB_OUTPUT
          echo "users_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=users.version)" >> $GITHUB_OUTPUT
          echo "appointments_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=appointments.version)" >> $GITHUB_OUTPUT
          echo "api_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=api.version)" >> $GITHUB_OUTPUT
          echo "frontend_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=frontend.version)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push auth image
        run: |
          docker build \
            --build-arg SERVICE_VERSION=${{ steps.svc_versions.outputs.auth_version }} \
            -t naksito03/auth-service:${{ steps.svc_versions.outputs.auth_version }} \
            -t naksito03/auth-service:latest \
            ./auth
          docker push naksito03/auth-service:${{ steps.svc_versions.outputs.auth_version }}
          docker push naksito03/auth-service:latest

      - name: Build and push api image
        run: |
          docker build \
            --build-arg SERVICE_VERSION=${{ steps.svc_versions.outputs.api_version }} \
            -t naksito03/api-service:${{ steps.svc_versions.outputs.api_version }} \
            -t naksito03/api-service:latest \
            ./api
          docker push naksito03/api-service:${{ steps.svc_versions.outputs.api_version }}
          docker push naksito03/api-service:latest

      - name: Build and push users image
        run: |
          docker build \
            --build-arg SERVICE_VERSION=${{ steps.svc_versions.outputs.users_version }} \
            -t naksito03/users-service:${{ steps.svc_versions.outputs.users_version }} \
            -t naksito03/users-service:latest \
            ./users
          docker push naksito03/users-service:${{ steps.svc_versions.outputs.users_version }}
          docker push naksito03/users-service:latest

      - name: Build and push appointments image
        run: |
          docker build \
            --build-arg SERVICE_VERSION=${{ steps.svc_versions.outputs.appointments_version }} \
            -t naksito03/appointments-service:${{ steps.svc_versions.outputs.appointments_version }} \
            -t naksito03/appointments-service:latest \
            ./appointments
          docker push naksito03/appointments-service:${{ steps.svc_versions.outputs.appointments_version }}
          docker push naksito03/appointments-service:latest

      - name: Build and push frontend image
        run: |
          docker build -t naksito03/frontend-service:${{ steps.svc_versions.outputs.frontend_version }} -t naksito03/frontend-service:latest ./frontend
          docker push naksito03/frontend-service:${{ steps.svc_versions.outputs.frontend_version }}
          docker push naksito03/frontend-service:latest
